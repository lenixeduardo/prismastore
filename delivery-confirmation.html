<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Confirmar recebimento · PrismaStore</title>
  <link rel="stylesheet" href="/src/delivery-confirmation.css?v=20260925-1" />
</head>
<body>
  <main class="delivery-page">
    <section class="delivery-card" aria-live="polite">
      <header class="delivery-brand">
        <img src="/assets/prismastore-prism-logo.png?v=20260923-logo-fix-1" alt="" />
        <strong>PrismaStore</strong>
      </header>

      <div id="delivery-loading" class="delivery-state">
        <div class="delivery-spinner" aria-hidden="true"></div>
        <p>Carregando confirmação de entrega…</p>
      </div>

      <section id="delivery-content" hidden>
        <div class="delivery-kicker">Confirmação de recebimento</div>
        <h1>Seu pedido chegou?</h1>
        <p class="delivery-lead">Confirme abaixo somente depois de receber os itens.</p>

        <div id="delivery-summary" class="delivery-summary"></div>

        <form id="delivery-form">
          <label>
            <span>Nome de quem recebeu</span>
            <input id="recipient-name" name="recipientName" autocomplete="name" maxlength="120" required />
          </label>

          <div class="delivery-field">
            <span class="delivery-label">Assinatura</span>
            <div class="signature-wrap">
              <canvas id="signature-canvas" width="640" height="240" aria-label="Área para assinatura"></canvas>
              <button type="button" id="clear-signature" class="link-button">Limpar assinatura</button>
            </div>
          </div>

          <label>
            <span>Foto da entrega <small>(opcional)</small></span>
            <input id="delivery-photo" type="file" accept="image/*" capture="environment" />
          </label>

          <label>
            <span>Observação <small>(opcional)</small></span>
            <textarea id="delivery-notes" maxlength="1000" rows="3"></textarea>
          </label>

          <label class="delivery-consent">
            <input id="delivery-accepted" type="checkbox" required />
            <span>Confirmo que recebi os itens descritos acima.</span>
          </label>

          <button id="confirm-delivery" class="primary-button" type="submit">Confirmar recebimento</button>
          <p id="delivery-error" class="delivery-error" role="alert"></p>
        </form>
      </section>

      <section id="delivery-success" class="delivery-success" hidden>
        <div class="success-mark">✓</div>
        <h1>Recebimento confirmado</h1>
        <p>Obrigado. A confirmação foi registrada com data e horário.</p>
      </section>
    </section>
  </main>
  <script type="module" src="/src/delivery-confirmation.js?v=20260925-1"></script>
</body>
</html>
