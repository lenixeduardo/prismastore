# Dedicated PrismaStore virtual host. Replace server_name with your hostname/IP.
# TLS should be configured before using administrative credentials remotely.
server {
    listen 80;
    server_name 163.176.60.192;

    include /etc/nginx/snippets/prismastore-security.conf;

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # This is the Internet-facing proxy. Never trust client-supplied XFF.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
