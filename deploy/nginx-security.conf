# Include inside every public server {} that proxies PrismaStore.
# Nginx matches normalized URIs (percent-decoded, dot segments resolved).
# Keep this before any broader regular-expression location. Do not add
# a `location ^~ /` proxy: that bypasses these regular-expression guards.
location ~* (^|/)\.(?!well-known(?:/|$)) {
    return 404;
}
location ~* ^/(?:data|backups|security-private|server|scripts|tests|docs|node_modules|deploy)(?:/|$) {
    return 404;
}
location ~* ^/(?:package(?:-lock)?\.json|npm-shrinkwrap\.json|README(?:\.[^/]*)?|PRISMASTORE_TODO\.md|design-qa\.md|(?:INICIAR|INSTALAR)_PRISMASTORE\.bat)$ {
    return 404;
}
location ~* \.(?:db(?:-(?:wal|shm))?|sqlite(?:3)?|sql|log|bak|backup|old|orig|save|swp|pem|key|conf|env|ya?ml|toml|lock)$ {
    return 404;
}
